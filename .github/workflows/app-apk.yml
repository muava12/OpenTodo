name: App APK build
'on':
  push:
    branches:
    - main
    - feat/**
    paths:
    - mobile/app/**
    - mobile/android/**
    - scripts/build-apk.sh
    - .github/workflows/app-apk.yml
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release APK (needs the keystore on the runner)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: app-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: mobile/app/package-lock.json
