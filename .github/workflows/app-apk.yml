name: Test 5 — base64 secret

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: echo hello
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
