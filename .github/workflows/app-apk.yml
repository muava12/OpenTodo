name: App APK build

# Build the native app's APK.
# Debug on every push that changes the app.
# Release (signed) on a tag or by hand, when the keystore is in the secrets.
#
#   gh workflow run app-apk.yml --ref <branch>            # debug
#   gh workflow run app-apk.yml --ref v1.0.0              # release (signed)
"on":
  push:
    branches: [main, 'feat/**']
    paths:
      - 'mobile/app/**'
      - 'mobile/android/**'
      - 'scripts/build-apk.sh'
      - '.github/workflows/app-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release APK (needs the keystore in the secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
        working-directory: mobile/app
      - name: Prebuild (android/ from app.config.ts)
        working-directory: mobile/app
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install
      - name: Debug APK
        working-directory: mobile/app/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Release APK (signed, base64 keystore)
        if: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE secret; skipping release build."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/opentodo-release.jks"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/opentodo-release.jks"
          VERSION=$(grep -oP "version: '\K[^']+" mobile/app/app.config.ts 2>/dev/null || echo '0.0.0')
          scripts/build-apk.sh release
          # Rename the APK to carry the version: opentodo-<version>.apk.
          if [ -f dist/opentodo-release.apk ]; then
            mv dist/opentodo-release.apk "dist/opentodo-$VERSION.apk"
            echo "Built opentodo-$VERSION.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: opentodo-apk
          path: |
            mobile/app/android/app/build/outputs/apk/debug/app-debug.apk
            dist/opentodo-*.apk
          if-no-files-found: warn